services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medical_db
      MYSQL_USER: medipredict
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-medipredict}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://medipredict:${MYSQL_PASSWORD:-medipredict}@db:3306/medical_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
