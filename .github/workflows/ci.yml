name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r backend/requirements.txt pytest httpx scipy
      - name: Quality gate (AUC on a fixed holdout sample)
        run: python -m ml.quality_gate
      - name: Tests
        run: python -m pytest -q
